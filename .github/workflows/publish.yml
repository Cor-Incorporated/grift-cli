name: publish

# Publishing is an explicit human gate. Creating or pushing a tag never
# publishes by itself; an operator dispatches this workflow with the exact
# annotated tag after reviewing the v0.6 release evidence.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "公開するannotated tag（例: v0.6.0）"
        required: true
        type: string
      provider_live_run_id:
        description: "同一commitで成功したv060-provider-live release tierのrun ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag_object: ${{ steps.release_ref.outputs.tag_object }}
      commit_oid: ${{ steps.release_ref.outputs.commit_oid }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout frozen v0.5.9 compatibility baseline
        uses: actions/checkout@v4
        with:
          repository: Cor-Incorporated/grift-cli
          # Pin the exact historical commit whose source version is 0.5.9 so the
          # compatibility oracle is immutable and independently auditable. This
          # must be a commit of the PUBLIC repository (the v0.5.9 tag there points
          # at it); the previous pin was a grift-cli-dev commit and the checkout
          # failed with 'not our ref' on the first real publish (run 34046881828).
          # tests/test_publish_baseline_pin.py links the three occurrences below.
          ref: 6711a3cdcb71f2a2a84276ac5e7a5abd4a7bf79f
          path: .release-baselines/grift-cli-v059
          fetch-depth: 1
      - name: Verify annotated tag and version binding
        id: release_ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 2
          }
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          echo "tag_object=$(git rev-parse "refs/tags/$RELEASE_TAG")" >> "$GITHUB_OUTPUT"
          echo "commit_oid=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os
          import runpy
          __version__ = runpy.run_path("src/tep_core/version.py")["__version__"]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if __version__ != expected:
              raise SystemExit(f"version mismatch: tag={expected} source={__version__}")
          print(f"release binding: v{__version__}")
          PY
      - name: Validate successful release provider run
        env:
          PROVIDER_LIVE_RUN_ID: ${{ inputs.provider_live_run_id }}
          VERIFIED_COMMIT_OID: ${{ steps.release_ref.outputs.commit_oid }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          run_id = os.environ["PROVIDER_LIVE_RUN_ID"]
          if re.fullmatch(r"[1-9][0-9]*", run_id) is None:
              raise SystemExit("provider live run ID must be a positive integer")
          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          expected = {
              "name": "v060-provider-live",
              "event": "workflow_dispatch",
              "conclusion": "success",
              "head_sha": os.environ["VERIFIED_COMMIT_OID"],
          }
          actual = {key: payload.get(key) for key in expected}
          if actual != expected:
              raise SystemExit("provider live run is not a successful same-commit release gate")
          print("successful same-commit release provider run confirmed")
          PY
      - name: Download same-commit release provider evidence
        uses: actions/download-artifact@v4
        with:
          name: v060-provider-live-release-${{ steps.release_ref.outputs.commit_oid }}
          path: provider-live-release-evidence
          run-id: ${{ inputs.provider_live_run_id }}
          github-token: ${{ github.token }}
      - name: Verify same-commit release provider evidence
        env:
          VERIFIED_COMMIT_OID: ${{ steps.release_ref.outputs.commit_oid }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python scripts/v060_provider_live_gate.py \
            --verify-summary provider-live-release-evidence/scenario-summary.json \
            --verify-ledger provider-live-release-evidence/guard-ledger.jsonl \
            --expected-tier release \
            --expected-source-commit "$VERIFIED_COMMIT_OID"
      - name: Install verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit and schema gates
        env:
          GRIFT_V059_ROOT: ${{ github.workspace }}/.release-baselines/grift-cli-v059
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          test "$(git -C "$GRIFT_V059_ROOT" rev-parse HEAD)" = \
            "6711a3cdcb71f2a2a84276ac5e7a5abd4a7bf79f"
          python - <<'PY'
          import hashlib
          import json
          import os
          import runpy
          import subprocess
          from pathlib import Path

          root = Path(os.environ["GRIFT_V059_ROOT"])
          expected_commit = "6711a3cdcb71f2a2a84276ac5e7a5abd4a7bf79f"
          commit = subprocess.check_output(
              ["git", "-C", str(root), "rev-parse", "HEAD"], text=True
          ).strip()
          tree = subprocess.check_output(
              ["git", "-C", str(root), "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          version = runpy.run_path(str(root / "src/tep_core/version.py"))["__version__"]
          if commit != expected_commit or version != "0.5.9":
              raise SystemExit(
                  f"invalid compatibility baseline: commit={commit} version={version}"
              )
          manifest = {
              "schema": "grift-release-baseline-v1",
              "version": version,
              "commit_oid": commit,
              "tree_oid": tree,
              "version_file_sha256": hashlib.sha256(
                  (root / "src/tep_core/version.py").read_bytes()
              ).hexdigest(),
          }
          Path("release-evidence/v059-baseline.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY
          python -m pytest tests -m "not golden"
          python tests/fixtures/v060/run_p0_falsify.py
          cp /tmp/grift-v060-falsify/p0-results.json release-evidence/p0-results.json
      - name: Legacy live golden corpus
        env:
          TEP_GOLDEN: "1"
        run: |
          set -euo pipefail
          python -m pytest -m golden
      - name: Replay v0.6 golden and bound scenario registries
        run: |
          set -euo pipefail
          python scripts/v060_golden.py --result v060-golden-result.json
          python scripts/v060_scenario_matrix.py --verify-registry
          python scripts/v060_scenario_matrix.py \
            --verify-registry \
            --digest-only \
            --output-root evidence/v060/scenarios-public
      - name: Dirty-source package gate
        run: |
          set -euo pipefail
          python scripts/package_smoke.py \
            --out package-dist \
            --ledger guard-ledger.jsonl
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ inputs.tag }}
          path: |
            v060-golden-result.json
            guard-ledger.jsonl
            package-dist/
            provider-live-release-evidence/
            release-evidence/
          if-no-files-found: error

  publish:
    needs: verify-release
    if: github.repository == 'Cor-Incorporated/grift-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.commit_oid }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck immutable release reference
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          VERIFIED_COMMIT_OID: ${{ needs.verify-release.outputs.commit_oid }}
          VERIFIED_TAG_OBJECT: ${{ needs.verify-release.outputs.tag_object }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT_OID"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG")" = "$VERIFIED_TAG_OBJECT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$VERIFIED_COMMIT_OID"
      - name: Download exact verified distributions
        uses: actions/download-artifact@v4
        with:
          name: release-verification-${{ inputs.tag }}
          path: verified-release
      - name: Recheck distribution SHA-256
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path
          root = Path("verified-release/package-dist")
          inventory = json.loads((root / "package-inventory.json").read_text())
          expected = {row["name"]: row["sha256"] for row in inventory}
          actual_files = sorted([*root.glob("*.whl"), *root.glob("*.tar.gz")])
          if set(expected) != {path.name for path in actual_files}:
              raise SystemExit("verified distribution member set mismatch")
          for path in actual_files:
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected[path.name]:
                  raise SystemExit(f"verified distribution digest mismatch: {path.name}")
          publish_root = Path("verified-dist")
          publish_root.mkdir()
          for path in actual_files:
              shutil.copyfile(path, publish_root / path.name)
          print("verified distribution digests match package smoke inventory")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: verified-dist
